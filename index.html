<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowBurstX Gaming</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="logo">🎮 ShadowBurstX</div>
            <button id="logoutBtn" class="logout-btn" style="display: none;">خروج</button>
        </nav>

        <!-- Login Page -->
        <div id="loginPage" class="page active">
            <div class="login-container">
                <h1>خوش آمدید</h1>
                <p class="subtitle">ShadowBurstX Gaming</p>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">نام کاربری:</label>
                        <input type="text" id="username" placeholder="نام کاربری خود را وارد کنید" required>
                    </div>
                    <div class="form-group">
                        <label for="password">رمز عبور:</label>
                        <input type="password" id="password" placeholder="رمز عبور خود را وارد کنید" required>
                    </div>
                    <button type="submit" class="login-btn">ورود</button>
                </form>

                <!-- Sign Up Section -->
                <div class="signup-section">
                    <p class="signup-text">حساب کاربری ندارید؟</p>
                    <button id="showSignupBtn" class="signup-btn">ثبت نام</button>
                </div>
            </div>

            <!-- Sign Up Form (Hidden by default) -->
            <div id="signupForm" class="signup-container" style="display: none;">
                <div class="login-container">
                    <h1>ثبت نام</h1>
                    <p class="subtitle">به ShadowBurstX Gaming بپیوندید</p>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="newUsername">نام کاربری:</label>
                            <input type="text" id="newUsername" placeholder="نام کاربری انتخاب کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="newEmail">ایمیل:</label>
                            <input type="email" id="newEmail" placeholder="ایمیل خود را وارد کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">رمز عبور:</label>
                            <input type="password" id="newPassword" placeholder="رمز عبور را انتخاب کنید" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">تأیید رمز عبور:</label>
                            <input type="password" id="confirmPassword" placeholder="رمز عبور را تأیید کنید" required>
                        </div>
                        <button type="submit" class="login-btn">ثبت نام</button>
                    </form>

                    <!-- Back to Login -->
                    <div class="signup-section">
                        <p class="signup-text">حساب کاربری دارید؟</p>
                        <button id="showLoginBtn" class="signup-btn">بازگشت به ورود</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Page (After Login) -->
        <div id="mainPage" class="page">
            <div class="content">
                <h1 class="title">شبکه های اجتماعی</h1>
                
                <div class="social-container">
                    <a href="https://www.instagram.com/shadowburstx_ff" target="_blank" class="social-btn">
                        <div class="icon">📷</div>
                        <div class="social-name">Instagram</div>
                        <div class="social-handle">@shadowburstx_ff</div>
                    </a>

                    <a href="https://t.me/ShadowBurstXGaming" target="_blank" class="social-btn">
                        <div class="icon">✈️</div>
                        <div class="social-name">Telegram</div>
                        <div class="social-handle">@ShadowBurstXGaming</div>
                    </a>

                    <a href="https://www.youtube.com/@ShadowBurstX_FF" target="_blank" class="social-btn">
                        <div class="icon">▶️</div>
                        <div class="social-name">YouTube</div>
                        <div class="social-handle">@ShadowBurstX_FF</div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>🎮 ShadowBurstX — All Rights Reserved 2026 ©</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
